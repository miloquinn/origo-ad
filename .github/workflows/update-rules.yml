name: Update lite, balanced, and powerful ad rules

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

concurrency:
  group: update-origo-ad-rules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Fetch, build, and apply lite safety gates
        run: python tools/build.py --tier lite

      - name: Fetch, build, and apply balanced safety gates
        run: python tools/build.py

      - name: Fetch, build, and apply powerful safety gates
        run: python tools/build.py --tier powerful

      - name: Validate generated artifacts offline
        run: python tools/validate.py

      - name: Commit only verified content changes
        shell: bash
        run: |
          if git diff --quiet -- dist; then
            echo "No verified rule changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "Keep all three ad-blocking tiers current without weakening publication gates" \
            -m "Daily lite, balanced, and powerful source refreshes are normalized, allowlisted, deduplicated, range-checked, compared with their previous verified reports, and validated before publication." \
            -m "Constraint: Publish domain-only Egern/Surge artifacts; never mirror scripts, rewrites, or MITM configuration." \
            -m "Confidence: high" \
            -m "Scope-risk: narrow" \
            -m "Tested: python -m unittest discover -s tests -v; python tools/build.py --tier lite; python tools/build.py; python tools/build.py --tier powerful; python tools/validate.py"
          git push
